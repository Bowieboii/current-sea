name: ChronoWarrant ACE bridge
on:
  push:
    branches:
      - chronowarrant-ace-bridge

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch canonical ACE train split
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/FujitsuResearch/Fujitsu-Assessing-Compliance-in-Enterprise-Dataset/main/train.json"
          curl -L --fail --retry 5 --retry-all-errors -o train.json "$url"
          python - <<'PY'
          import hashlib, json, pathlib, sys
          p = pathlib.Path("train.json")
          data = p.read_bytes()
          git_sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          sha256 = hashlib.sha256(data).hexdigest()
          expected_git_sha = "da9d3ea45ca8dc1e800a15eafb7ca69058640d55"
          if git_sha != expected_git_sha:
              raise SystemExit(f"Git blob mismatch: {git_sha} != {expected_git_sha}")
          obj = json.loads(data)
          if not isinstance(obj, list) or len(obj) != 3600:
              raise SystemExit(f"Unexpected ACE train cardinality: {type(obj).__name__} {len(obj) if isinstance(obj, list) else 'n/a'}")
          from collections import Counter
          labels = Counter(x.get("gd_tr") for x in obj)
          expected = {"Compliant":1200, "Non-Compliant":1200, "Not-Applicable":1200}
          if dict(labels) != expected:
              raise SystemExit(f"Unexpected label distribution: {dict(labels)}")
          pathlib.Path("ACE_FETCH_PROVENANCE.txt").write_text(
              "\n".join([
                  "source=" + "https://raw.githubusercontent.com/FujitsuResearch/Fujitsu-Assessing-Compliance-in-Enterprise-Dataset/main/train.json",
                  f"bytes={len(data)}",
                  f"git_blob_sha1={git_sha}",
                  f"sha256={sha256}",
                  f"examples={len(obj)}",
                  "labels=" + json.dumps(dict(labels), sort_keys=True),
                  "",
              ]),
              encoding="utf-8",
          )
          print(pathlib.Path("ACE_FETCH_PROVENANCE.txt").read_text())
          PY
      - name: Upload verified train split
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ace-train
          path: |
            train.json
            ACE_FETCH_PROVENANCE.txt
          compression-level: 9
          if-no-files-found: error
          retention-days: 1
