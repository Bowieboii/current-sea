[project]
name = "current-sea"
version = "0.0.1"
description = "CURRENT•SEA v0.001 — one observable, legitimate digital micro-asset"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
