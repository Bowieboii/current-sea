[project]
name = "current-sea"
version = "0.0.2"
description = "CURRENT•SEA v0.002 — one externally deployable machine-callable asset"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]==0.141.1",
    "mcp==2.1.1",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
